<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Jump Goober Jump</title>
  <link rel="icon" type="image/png" href="img/guyright.png" />
  <style>
    @font-face {
      font-family: 'Bienvenu';
      src: url('fonts/Bienvenu.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    #game-container {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      position: relative;
      overflow: hidden;
    }

    canvas {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
      z-index: 60;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <!-- Commit display (bottom-left) -->
  <div id="commit-display" style="position:fixed;bottom:8px;left:12px;z-index:50;
       color:#555;font-size:10px;font-family:monospace;">
    loading commit...
  </div>

  <!-- REC button (top-left, page-level, outside the game canvas) -->
  <div id="rec-ui" style="position:fixed;top:12px;left:12px;z-index:50;
       display:flex;align-items:center;gap:8px;">
    <button id="rec-button" style="width:36px;height:36px;border-radius:50%;
            border:2px solid #666;background:#222;color:#888;font-size:18px;
            cursor:pointer;" title="Record inputs (F9)">●</button>
    <span id="rec-status" style="color:#888;font-size:12px;font-family:monospace;
          display:none;">● REC <span id="rec-timer">0:00</span></span>
  </div>

  <div style="position:fixed;bottom:8px;right:12px;z-index:50;">
    <a href="https://github.com/spotco/Jump--goober--Jump--" target="_blank"
       style="color:#444;font-size:10px;font-family:monospace;text-decoration:none;">
      original source
    </a>
  </div>
  <script src="lib/phaser.min.js"></script>
  <script type="module" src="src/Main.js"></script>
  <script>
    // Page-level UI: commit display + REC button (outside the game canvas).
    (function() {
      // Commit display
      fetch('version.json')
        .then(r => r.json())
        .then(v => {
          document.getElementById('commit-display').textContent =
            'commit ' + v.short + ' — ' + v.message;
        })
        .catch(() => {
          document.getElementById('commit-display').textContent = 'commit unknown';
        });

      // REC button
      const btn = document.getElementById('rec-button');
      const status = document.getElementById('rec-status');
      const timer = document.getElementById('rec-timer');

      function getEngine() {
        try {
          const game = window.jumpGooberJumpGame;
          if (!game) return null;
          const scene = game.scene.getScene('GameScene');
          return (scene && scene.gameEngine) || null;
        } catch (e) { return null; }
      }

      btn.addEventListener('click', () => {
        const engine = getEngine();
        if (!engine) return;
        if (engine.inputRecording) {
          engine.downloadRecording();
        } else {
          engine.startRecording();
        }
        updateRecUI();
      });

      function updateRecUI() {
        const engine = getEngine();
        const isRec = !!(engine && engine.inputRecording);
        if (isRec) {
          btn.style.borderColor = '#f00';
          btn.style.color = '#f00';
          btn.style.background = '#400';
          status.style.display = 'inline';
        } else {
          btn.style.borderColor = '#666';
          btn.style.color = '#888';
          btn.style.background = '#222';
          status.style.display = 'none';
        }
      }

      // Update timer while recording
      setInterval(() => {
        const engine = getEngine();
        if (engine && engine.inputRecording) {
          const elapsed = Date.now() - (engine.inputRecordStart || Date.now());
          // inputRecordStart is performance.now(); approximate with Date
          // Actually use the engine's tick-based timing if available
          const secs = Math.floor((performance.now() - engine.inputRecordStart) / 1000);
          timer.textContent = Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0');
          // Pulse
          btn.style.opacity = 0.6 + 0.4 * Math.sin(Date.now() / 200);
          updateRecUI();
        } else {
          btn.style.opacity = 1;
          if (status.style.display !== 'none') updateRecUI();
        }
      }, 250);
    })();
  </script>
</body>
</html>
